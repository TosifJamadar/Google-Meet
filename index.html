<!DOCTYPE html>
<html lang="en">
<head>
    <title>Google Meet</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #F8F9FA;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            font-weight: 600;
            color: #202124;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .student-card {
            border: none;
            padding: 15px 20px;
            margin: 10px;
            border-radius: 12px;
            background-color: white;
            width: 280px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .student-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .student-card img {
            border-radius: 50%;
            background-color: #f0f0f0;
            padding: 4px;
        }

        #search {
            padding: 15px 20px;
            margin: 10px 0 25px 0;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            width: 400px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.9);
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
        }

        #search:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        #search::placeholder {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Google Meet</h1>
    <div class="container">
        <input type="text" id="search" placeholder="Enter Name to Search..." onkeyup="search()">
        <div id="student-list"></div>
    </div>

    <script>
        const Students = [
            "Akshay",
            "Samartha",
            "Soham",
            "Tosif",
            "Om",
            "Raj",
            "Rohit",
            "Sohil"
        ];
        const studentList = document.getElementById("student-list");

        // Initial Rendering of Students
        Students.forEach((stud) => {
            studentList.innerHTML += `
                <div class="student-card">
                    <img src="user.png" alt="user" width="25px" height="25px" />
                    ${stud}
                </div>
            `;
        });

        // Search Functionality
        function search() {
            studentList.innerHTML = ""; // Clear the list
            const searchValue = document.getElementById("search").value.toLowerCase();

            const filteredStudents = Students.filter((stud) =>
                stud.toLowerCase().includes(searchValue)
            );

            filteredStudents.forEach((stud) => {
                studentList.innerHTML += `
                    <div class="student-card">
                        <img src="user.png" alt="user" width="25px" height="25px" />
                        ${stud}
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
